name: grow bonsai

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  bonsai:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: generate bonsai
        uses: egorthinks/git-bonsai@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          user: Raw3a-Gamal
          output-dir: .
          commit: false

      - name: push to bonsai branch
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git checkout -B bonsai
          git add bonsai.svg
          git commit -m "update bonsai" || exit 0
          git push origin bonsai --force
